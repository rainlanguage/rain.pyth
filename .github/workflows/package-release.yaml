name: Package Release
on:
  push:
    branches:
      - main
jobs:
  release:
    # A called workflow cannot elevate the caller's token; these are exactly
    # the scopes rainix-autopublish's release job requests.
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      soldeer-package: rain-pyth
    secrets: inherit
